name: build

# Every push and pull request: validate the structure, build every plugin
# (plugins/*/) with Zig 0.15.2 and run their offline tests (tests that need
# the game's files or the OpenBox app repo skip themselves here). A pushed tag
# v* publishes one <folder>-<version>.zip per plugin and, per game (games.json),
# <game>-plugins-<version>.zip; v0.x and tags with a suffix are pre-releases.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: 0.15.2
  # SHA-256 of the official zig-x86_64-windows-0.15.2.zip.
  ZIG_SHA256: 3A0ED1E8799A2F8CE2A6E6290A9FF22E6906F8227865911FB7DDEDC3CC14CB0C

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # forza_injector: its SDK (Xtra Options builds against it) and core/patches.json (its tests).
      - uses: actions/checkout@v4
        with:
          repository: byzyn4ik/forza-injector
          path: forza-injector
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get Zig ${{ env.ZIG_VERSION }}
        shell: pwsh
        run: |
          $name = "zig-x86_64-windows-$env:ZIG_VERSION"
          Invoke-WebRequest "https://ziglang.org/download/$env:ZIG_VERSION/$name.zip" -OutFile zig.zip
          if ((Get-FileHash zig.zip -Algorithm SHA256).Hash -ne $env:ZIG_SHA256) { throw 'Zig download hash mismatch' }
          Expand-Archive zig.zip $env:RUNNER_TEMP
          "ZIG=$env:RUNNER_TEMP\$name\zig.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Validate, build and test
        shell: pwsh
        run: |
          $version = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = @('--version', $env:GITHUB_REF_NAME.Substring(1)) }
          $env:FORZA_SDK = "$env:GITHUB_WORKSPACE\forza-injector\sdk\include"
          python build.py --zig $env:ZIG --test --output out @version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: out/release/*.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=
          case "$TAG" in v0.*|*-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" release/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "FH2 Extra Options injector plugins ${TAG#v}${prerelease:+ (alpha)}" --generate-notes $prerelease
