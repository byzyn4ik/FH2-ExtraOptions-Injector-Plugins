; Xtra Options (Fast & Furious): the Forza Horizon 2 Extra Options features that
; also work in Forza Horizon 2 Presents Fast & Furious, one DLL each, with Extra
; Options' own key names. Read once when the game starts. 1 = on, 0 = off.
; Deleting a feature's DLL from this folder removes the feature.

[Frontend]
; SkipIntros.dll: skip the developer opening videos.
SkipIntro=1

[PhotoMode]
; PhotoMode.dll: removes the camera collision detection and boundaries in photo mode.
FreeCamera=1
; PhotoModeUnlock.dll (Fast & Furious only): photo mode before the game unlocks it
; (its photo check reads the locked flag as set; the game's other photo conditions stay).
; Off by default: the game sets that flag itself. Photo mode in free roam is a long press
; of D-pad up (Keyboard & Mouse: a tap of P holds it long enough).
UnlockEarly=0

[Compatibility]
; ParentalLocks.dll: allows user-created content privilege checks locally.
DisableParentalLocks=1

[Map]
; TreasureMap.dll (Fast & Furious only): the world map shows every discount board
; and barn-find spot, as Forza Horizon 2's Treasure Map does (Fast & Furious sells no
; Treasure Map, its code is still there). A board is marked discovered when the game
; sets it up, and the game saves that; turning this off later does not hide them again.
TreasureMap=0
; MapTeleport.dll (Fast & Furious only): on the world map (pause menu > Map, or the
; View button in free roam), hold the button to travel to the map cursor: the game's
; own fast travel (it picks the nearest road there and faces along it), free of charge
; and without the fast-travel boards. A tap keeps the button's game action (X: fast
; travel to a festival site or house; Y: set or clear the GPS waypoint). Free roam
; only: in events, races and missions the button stays the game's. The map's button bar shows
; the button with "Teleport (hold)" in the game's language.
Teleport=1
; X or Y. Keyboard & Mouse: the key bound to MenuX (X) or MenuY (Y).
TeleportButton=X
; Milliseconds the button must be held, 0-5000. 0: a press travels at once, and the
; button's game action on the map is gone while Teleport=1.
TeleportHold=500
