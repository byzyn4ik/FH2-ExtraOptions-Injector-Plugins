; Custom Radio for Forza Horizon 2 (Extra Options plugin)
; Read once when the game starts. An empty or missing value means the default.

[CustomRadio]
; 1: add the station (only when the folder has playable music files: MP3 and FLAC, also WAV, M4A, WMA).
Enabled=1
; The music folder (MP3 and FLAC): full, or relative to the folder of Azimuth.exe. Default: Music
Folder=Music
; The station name shown in game. Default: MY MUSIC (MOJA MUZYKA in Polish, MOYA
; MUZYKA in Cyrillic with Language Support's Ukrainian pack).
Name=
; Station volume in percent, 0-400. Default: 100
Volume=100
; 1: every radio station is available, whatever the progression (also with Enabled=0).
UnlockAllStations=0
; 1: Windows decodes the MP3s (clean stereo); 0: the game's FMOD decoder plays them.
; (FLAC, WAV, M4A and WMA are always decoded by Windows.)
PcmDecode=1
; The station's logo on the HUD's radio display. Empty: the built-in logo (MY MUSIC,
; MOJA MUZYKA, the Ukrainian one, or a record and note alone for another Name). Or your own
; PNG: full path, or relative to this folder; transparent background, ideally 196x96 (any size from 8x8 to
; 4096x4096 is fitted into 196x96, against the right edge). A file that cannot be used
; is logged and the built-in logo shown.
Logo=

[Keys]
; Read only while driving with the game window focused (not in menus or loading).
; Keyboard: F1-F24, A-Z, 0-9, Escape, Enter, Space, Tab, Backspace, Insert, Delete,
; Home, End, PageUp, PageDown, Up, Down, Left, Right, Shift, Ctrl, Alt, a virtual-key
; code (0x78 or 120), or None.
; Xbox: A, B, X, Y, LB, RB, DPadUp, DPadDown, DPadLeft, DPadRight, View, Menu,
; LeftStick, RightStick, combined with + (for example LB+Y), or None.
; Extra Options' own default keys are F1-F4; choose keys it does not use.

; Tunes the radio to the custom station.
RadioStationKeyboard=F9
RadioStationXbox=None
; Next track.
RadioNextKeyboard=F7
RadioNextXbox=None
; Restarts the track; within 3 seconds of its start, the previous track.
RadioRestartKeyboard=F6
RadioRestartXbox=None
