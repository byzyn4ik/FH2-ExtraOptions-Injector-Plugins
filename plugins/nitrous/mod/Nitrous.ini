; Nitrous for Forza Horizon 2 (Extra Options plugin)
; Read once when the game starts.

[Nitrous]
; 1: hold Key or PadButton with the throttle fully down to boost the player's car.
; 0: the plugin does nothing.
Enabled=1

; The keyboard key (only while the game window has the focus): a letter or
; digit, F1..F24, Space, Tab, CapsLock, Shift, LShift, RShift, Ctrl, LCtrl,
; RCtrl, Alt, LAlt, RAlt, Enter, Backspace, Insert, Delete, Home, End, PageUp,
; PageDown, Up, Down, Left, Right, MouseLeft, MouseRight, MouseMiddle, Mouse4,
; Mouse5, or a virtual-key code (0x..). Empty or None: no key.
; Left Shift, as in Fast & Furious. Keyboard & Mouse (0.0.2 and later) puts its
; Forza Horizon 2 Clutch on Left Ctrl by default, Fast & Furious' layout.
Key=LShift

; The gamepad button: LeftStick (L3, the left stick click: unused while driving
; in Forza Horizon 2), RightStick, A, B, X, Y, LB, RB, DPadUp, DPadDown,
; DPadLeft, DPadRight, View, Menu. Empty or None: no button.
PadButton=LeftStick

; Fast & Furious' values (its NitrousPrototype entity) are the defaults.
; The engine's driving torque is multiplied by this while boosting (1 to 5).
TorqueScale=1.6
; Seconds of boost in a full tank (0.5 to 600).
Duration=20
; Seconds for a boost to reach the full TorqueScale (0.01 to 10).
BuildupTime=0.5
; Seconds to refill an empty tank while not boosting (0.5 to 3600).
; 0: the tank never refills (a new car starts with a full one).
RechargeTime=60

; ---- Rules: one preset, then any key below (remove its ";") to override it.
; Mode=Arcade: the tank refills over time (RechargeTime), nitrous everywhere,
;   no skill refill, crashes cost nothing (what 0.0.3 did).
; Mode=Underground: like Need for Speed Underground: the tank refills only
;   from driving skill ([SkillRecharge]), a crash drains 4 s and ends the
;   boost; no refill over time; races and free roam.
; Mode=Custom: Arcade's values, meant to be changed key by key.
Mode=Arcade
; 1: the tank refills over time, RechargeTime seconds from empty.
;AutoRecharge=1
; Where nitrous works (from the game's own telemetry: a race starts and ends
; with its AnthemRaceStart / AnthemRaceEnd events; head-to-heads count as
; races). Elsewhere the button does nothing and the gauge is dimmed.
;InRaces=1
;FreeRoam=1
; Showcases, bucket list challenges, Rivals, online road trips and rounds.
;InOtherEvents=1
; 1: skills refill the tank: seconds per skill in [SkillRecharge].
;SkillRecharge=0
; Seconds of tank lost per crash (0: none). A crash is CrashMinImpact km/h
; of speed lost within 0.15 s (no brake does that); one a second at most.
;CrashPenalty=0
;CrashMinImpact=25
; 1: a crash also ends the boost.
;CrashCancelsBoost=0

[SkillRecharge]
; Seconds of tank (of Duration) each skill gives with SkillRecharge=1, by the
; game's skill names: Drift (Drift, E-Drift), NearMiss (Near Miss, Threading
; the Needle, Lucky Escape, Daredevil), Draft (Draft, Slingshot), Air (any Air
; skill, Kangaroo, Crash Landing), Pass (Pass, Triple Pass, Clean Start, Hard
; Charger), Speed (Clean Speed, Fast and Clean, Speed), Wrecker (Destruction,
; Wrecking Ball, Landscaping, Trashman), Contact (Side Swipe, Trading Paint,
; Love Tap), Other (the rest: Burnout, Two Wheels, 180...). ChainPer1000:
; seconds per 1000 points of a banked skill chain. Underground's values:
;Drift=2
;NearMiss=1.5
;Draft=1.5
;Air=2
;Pass=1
;Speed=1
;Wrecker=0.5
;Contact=0.5
;Other=0.5
;ChainPer1000=0.5
[Effects]
; Forza Horizon 2 has none of Fast & Furious' nitrous effects; these rebuild
; them. The gauge is drawn by the Performance plugin: see [Nitrous] in
; mods\Performance\plugins\Performance.ini.

; 1: the exhaust spits flames while boosting, as in Fast & Furious (its test,
; in Forza Horizon 2's own exhaust backfire: every exhaust, every frame).
ExhaustFlames=1
; Seconds the flames go on after a boost, ended by one pop (0 to 5; Fast &
; Furious: none, they stop at once).
ExhaustTail=0.35
; Seconds over which the camera's boost (its FOV, shake, offsets, blur) and the
; rumble fade out after a boost (0 to 10; 0: at once, as Fast & Furious feeds
; its camera; its follow camera's own layers then still ease out over 2 s).
EaseOut=1.5

; 1: Fast & Furious' own camera while boosting: its 52 nitrous layers of
; CameraPhysics.xml (the FOV kick, shake, offsets and motion blur, in the
; follow, cockpit, hood and bumper cameras), when the mod's
; media\Camera\CameraPhysics.xml is there: tools\ff_camera.py makes it from
; your Fast & Furious install. Fov below is then not used.
CameraLayers=1

; 1: the pad rumbles while boosting, as in Fast & Furious (its ControllerRumble.xml
; <Nitrous> curves: a light rumble that grows strong as the tank empties).
Rumble=1

; Without those layers, 1: the camera widens while boosting, as Fast &
; Furious' follow cameras do (its CameraPhysics.xml): FovDegrees at full
; boost, after a squeeze of FovImpulseDegrees that fades as the boost starts;
; back over 2 s after it.
Fov=1
; Degrees (0 to 30). Fast & Furious: 5, 5, and none in the cockpit, hood and
; bumper cameras.
FovDegrees=5
FovImpulseDegrees=5
FovCockpitDegrees=0

; 1: sound. Fast & Furious' own NOS sounds when NitrousSounds\ (beside this
; file) has nos_start.wav, nos_sustain.wav and nos_stop.wav; the plugin's
; tools\ff_sounds.py makes them from your Fast & Furious install. Without
; them, a synthesized burst and hiss. Silent while the game is not in focus.
Sound=1
; 0 to 1.
SoundVolume=0.6
