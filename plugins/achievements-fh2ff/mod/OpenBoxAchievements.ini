; OpenBox Achievements for Forza Horizon 2 Presents Fast & Furious (forza_injector plugin)
; Read once when the game starts. An empty value means the default.

[Achievements]
; 1: evaluate the Fast & Furious achievement rules in game and send the results to OpenBox.
Enabled=1
; The OpenBox game id (its games\<id> folder).
Game=fh2ff
; 1: the pause menu's Achievements button (Progress tab) opens OpenBox Achievements.
PauseButton=1
; The Fast & Furious saves folder for the save stats (full, or relative to the game
; launcher's folder). Default: <launcher>\data\titles\5A9771A4\saves.
Saves=
; Another rules file instead of the built-in rules (full, or relative to this folder).
Rules=

[OpenBox]
; The app's folder (full, or relative to the game launcher's folder).
; Default: the folder its setup recorded (HKCU\Software\OpenBox Achievements\InstallFolder).
AppFolder=
; 1: start OpenBox Achievements in the tray with the game when it is not running.
StartWithGame=1
; OpenBox's data folder. Default: %LOCALAPPDATA%\OpenBoxAchievements
Data=
; OpenBox's pipe name. Default: OpenBoxAchievements.Events.v1
Pipe=

[Logging]
; 1: OpenBoxAchievements.log beside the plugin.
Enabled=1
; 1: also OpenBoxAchievements.telemetry.jsonl, every event the rules saw (for replays).
Telemetry=0
