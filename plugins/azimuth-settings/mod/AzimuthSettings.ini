; Azimuth Settings (Extra Options / forza_injector plugin)
; Read once when the game starts. An empty value means the default.

[Video]
; 1: Azimuth's graphics settings as rows of the game's Video settings page.
Enabled=1

[Audio]
; 1: Azimuth's sound and language settings (audio output, volume, speech and
; text language) as rows of the game's Audio settings page.
Enabled=1

[Azimuth]
; 1: frame rate, display mode, shadow distance, shadow redraw and volume apply
; at once (where Azimuth and the game are as inspected); 0: every change
; applies after a restart.
LiveApply=1
; Azimuth's settings file (full, or relative to the launcher's folder).
; Default: <launcher>\data\azimuth.ini
Ini=

[Captions]
; auto: Polish when the game runs in Polish, Ukrainian while Language Support's
; Ukrainian pack fills the ru-RU slot, else English. en, pl or uk: always.
Language=auto

[Logging]
; 1: AzimuthSettings.log beside the plugin.
Enabled=1
