; Performance for Forza Horizon 2 (Extra Options plugin)
; ShowFps and PerfLog apply at once when this file changes while the game
; runs (after the counter or the log was on once); the Video settings page row
; writes ShowFps here.

[Performance]
; FPS counter in the top-right corner. 0: off. 1: FPS, GPU load and video
; memory. 2: also the frame time, the 1% low and the GPU frame time.
ShowFps=1
; 1: one line a second (FPS, frame times, 1% low, GPU frame time) appended to
; the performance log.
PerfLog=0
; The performance log (full, or relative to this folder).
; Default: fh2-perf.csv beside this file.
PerfLogFile=
; 1: an "FPS counter" row (Off / On / Detailed) on the game's Video settings page.
MenuRow=1

[Nitrous]
; With the Nitrous plugin installed (mods\Nitrous), Fast & Furious' nitrous
; bar beside the speedometer. Without
; Nitrous none of this runs. Read when the game starts.
; 1: the gauge (Fast & Furious' bar: its shader, colour and layout; its
; outline texture is read from your Fast & Furious install when found).
Gauge=1
; 1: only while driving (not in menus, the pause menu or the map).
OnlyWhileDriving=1
; The gauge's size and place, for a HUD that is not where Forza Horizon 2
; puts its speedometer: a scale (0.5 to 3) and offsets in 1080p pixels
; (right and down are positive).
GaugeScale=1
GaugeOffsetX=0
GaugeOffsetY=0
; Fast & Furious' SpireHUD.zip, or a folder holding it (its media, Mount or
; game folder). Empty: looked for beside the game's folders, as
; ...\Forza Horizon 2 Presents Fast & Furious\game\base\Mount\media.
FastFuriousMedia=
