; Saves in Documents for Forza Horizon 2 (Extra Options / forza_injector plugin)
; Read once when the game starts.
;
; Under forza_injector the game can load and store its saves in Documents
; itself (forza-injector.ini [Saves] Location=Documents, beside winmm.dll).
; Otherwise the game keeps its saves where Azimuth puts them
; (data\titles\<title>\saves beside Azimuth.exe) and this plugin copies every
; new save into Folder and checks the copy (SHA-256). It only reads the game's
; saves and never writes there.

[DocumentsSaves]
; 1: on. 0: the plugin does nothing.
Enabled=1

; Auto: under forza_injector, the saves are loaded and stored in Documents from
;   the next start (the plugin writes [Saves] Location=Documents into
;   forza-injector.ini when it has no Location yet; Location=Game is kept);
;   until then, and under Extra Options, they are mirrored.
; Redirect: the same; under Extra Options (which starts plugins too late to
;   redirect) the log says so and the saves are mirrored.
; Mirror: only mirror, also under forza_injector.
; While forza_injector loads and stores the saves in Documents nothing is mirrored.
Mode=Auto

; The copy. Empty: Documents\My Games\Forza Horizon 2\Saves\1A96545B
; (Fast & Furious: ...\Forza Horizon 2 Presents Fast & Furious\Saves\5A9771A4).
; A full path; environment variables work.
Folder=

; 0: every save ever copied is kept (a profile save is about 6.5 MB).
; 2 or more: per save (profile, photo, livery ...), only that many of the
; newest copies are kept; older copies in Folder are removed.
KeepRevisions=0
