; Xtra Options (forza_injector plugins): Forza Horizon 2 Extra Options' features,
; one DLL each, with Extra Options' own key names; Xtra Features keeps its own
; XtraFeatures.ini. Read once when the game starts. 1 = on, 0 = off.
; Deleting a feature's DLL from this folder removes the feature.

[Frontend]
; SkipIntros.dll: skip the developer opening videos.
SkipIntro=1
; OnlineMenus.dll: enables the pause menu tabs that require an Xbox Live connection.
EnableMarketplace=1
EnableSocial=1
EnableClubs=1
EnableRivals=1

[Content]
; Unlocks.dll: every DLC pack unlocked.
UnlockDLC=1
; Unlocks.dll: VIP status without Xbox Live.
OfflineVIP=1
; Unlocks.dll: the Storm Island cars can be bought without the island's progress.
UnlockStormIslandCars=1
; Unlocks.dll: reveals all bonus boards and barn locations on the mainland and Storm Island.
; Also enables the Treasure Map listing in the Extras menu of the Marketplace tab while offline.
; Important: enabling this, entering the game, saving, disabling this, and then entering the
; game again will keep all boards discovered.
UnlockTreasureMap=0

[PhotoMode]
; PhotoMode.dll: removes the camera collision detection and boundaries in photo mode.
FreeCamera=1

[Compatibility]
; ParentalLocks.dll: allows user-created content privilege checks locally.
DisableParentalLocks=1

[Experiments]
; AeroTuning.dll: experimental; can change PI/handling even at default tuning.
UnlockAeroTuning=0
