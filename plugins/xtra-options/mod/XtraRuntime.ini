; XtraRuntime.dll: the coupled Extra Options runtime (Forza Horizon 2 only).
; Keeps the original Extra Options defaults. Add original sections/keys here
; to override them. Existing launcher-folder FH2_ExtraOptions.ini takes
; precedence, preserving an existing installation without rewriting settings.
; Binary menu settings and Gamerpic.png retain their launcher-folder paths.
; Independent feature DLLs use XtraOptions.ini instead.

[Global]
Enabled=1
